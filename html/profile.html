<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - GameHub</title>

    <link
        rel="stylesheet"
        <link rel="stylesheet" href="../style.css">
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="container header-container">

        <a
            href="index.html"
            class="logo"
        >

            <i class="fa-solid fa-gamepad"></i>

            <span>GameHub</span>

        </a>


        <nav class="nav">

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                Trang chủ
            </a>

            <a href="games.html">
                <i class="fa-solid fa-gamepad"></i>
                Games
            </a>

            <a
                href="profile.html"
                class="active"
            >
                <i class="fa-solid fa-user"></i>
                Profile
            </a>

            <a href="admin.html">
                <i class="fa-solid fa-gear"></i>
                Admin
            </a>

        </nav>


        <!-- KHU VỰC ĐĂNG NHẬP -->

        <div
            id="authArea"
            class="auth-area"
        ></div>

    </div>

</header>



<!-- ================= PROFILE ================= -->

<main class="profile-page">

    <div class="container">


        <div class="profile-card">


            <!-- AVATAR -->

            <div class="profile-avatar">

                <i class="fa-solid fa-user"></i>

            </div>


            <!-- TÊN -->

            <h1 id="profileName">
                Người dùng
            </h1>


            <p id="profileEmail">
                Email
            </p>


            <span class="profile-status">

                <i class="fa-solid fa-circle"></i>

                Đang hoạt động

            </span>



            <!-- THÔNG TIN -->

            <div class="profile-info">


                <div class="profile-item">

                    <i class="fa-solid fa-user"></i>

                    <div>

                        <span>
                            Tên người dùng
                        </span>

                        <strong id="profileUsername">
                            -
                        </strong>

                    </div>

                </div>



                <div class="profile-item">

                    <i class="fa-solid fa-envelope"></i>

                    <div>

                        <span>
                            Email
                        </span>

                        <strong id="profileEmailInfo">
                            -
                        </strong>

                    </div>

                </div>



                <div class="profile-item">

                    <i class="fa-solid fa-calendar"></i>

                    <div>

                        <span>
                            Ngày tham gia
                        </span>

                        <strong id="profileDate">
                            -
                        </strong>

                    </div>

                </div>


            </div>



            <!-- ACTION -->

            <div class="profile-actions">

                <button
                    id="logoutBtn"
                    class="btn-primary"
                    type="button"
                >

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Đăng xuất

                </button>

            </div>

        </div>

    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container">

        <div class="footer-bottom">

            <p>
                © 2026 GameHub. All rights reserved.
            </p>

        </div>

    </div>

</footer>



<script src="../js/auth.js"></script>

<script src="../js/profile.js"></script>

<script src="../js/main.js"></script>


</body>

</html>
