<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Đăng ký tài khoản GameHub"
    >

    <title>Đăng ký - GameHub</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        <link rel="stylesheet" href="../style.css">
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="container header-container">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >

                <i class="fa-solid fa-gamepad"></i>

                <span>
                    GameHub
                </span>

            </a>


            <!-- NAVIGATION -->

            <nav class="nav">

                <a href="index.html">

                    <i class="fa-solid fa-house"></i>

                    Trang chủ

                </a>


                <a href="games.html">

                    <i class="fa-solid fa-gamepad"></i>

                    Games

                </a>


                <a href="login.html">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Đăng nhập

                </a>

            </nav>

        </div>

    </header>



    <!-- ==================================================
         REGISTER
    ================================================== -->

    <main class="auth-page">

        <div class="auth-box">


            <!-- ICON -->

            <div class="auth-icon">

                <i class="fa-solid fa-user-plus"></i>

            </div>


            <!-- TITLE -->

            <h1>
                Tạo tài khoản
            </h1>


            <p>
                Tham gia GameHub ngay hôm nay.
            </p>



            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="registerName">

                        <i class="fa-solid fa-user"></i>

                        Tên người dùng

                    </label>


                    <input
                        type="text"
                        id="registerName"
                        placeholder="Nhập tên người dùng"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">

                        <i class="fa-solid fa-envelope"></i>

                        Email

                    </label>


                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">

                        <i class="fa-solid fa-lock"></i>

                        Mật khẩu

                    </label>


                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Nhập mật khẩu"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">

                        <i class="fa-solid fa-lock"></i>

                        Xác nhận mật khẩu

                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Nhập lại mật khẩu"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn-primary auth-submit"
                >

                    <i class="fa-solid fa-user-plus"></i>

                    Đăng ký

                </button>

            </form>



            <!-- LOGIN -->

            <p class="auth-link">

                Đã có tài khoản?

                <a href="login.html">
                    Đăng nhập
                </a>

            </p>

        </div>

    </main>



    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    © 2026 GameHub. All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="../js/auth.js"></script>

</body>

</html>
