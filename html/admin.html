<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameHub - Admin</title>

    <link
        rel="stylesheet"
        <link rel="stylesheet" href="../style.css">
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="container header-container">

        <a
            href="index.html"
            class="logo"
        >

            <i class="fa-solid fa-gamepad"></i>

            <span>GameHub</span>

        </a>


        <button
            class="menu-btn"
            id="menuBtn"
        >

            <i class="fa-solid fa-bars"></i>

        </button>


        <nav
            class="nav"
            id="mainNav"
        >

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                Trang chủ
            </a>

            <a href="games.html">
                <i class="fa-solid fa-gamepad"></i>
                Games
            </a>

            <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                Profile
            </a>

            <a
                href="admin.html"
                class="active"
            >
                <i class="fa-solid fa-gear"></i>
                Admin
            </a>

        </nav>

    </div>

</header>



<!-- ================= ADMIN ================= -->

<main>

<section>

<div class="container">


<div class="section-title">

    <div>

        <span>ADMIN PANEL</span>

        <h2>
            Quản lý Game
        </h2>

    </div>

</div>



<!-- STATISTICS -->

<div
    class="feature-grid"
    style="margin-bottom:30px;"
>

    <div class="feature-card">

        <div class="feature-icon">

            <i class="fa-solid fa-gamepad"></i>

        </div>

        <h3 id="totalGames">
            0
        </h3>

        <p>
            Tổng số game
        </p>

    </div>


    <div class="feature-card">

        <div class="feature-icon">

            <i class="fa-solid fa-heart"></i>

        </div>

        <h3 id="totalFavorites">
            0
        </h3>

        <p>
            Lượt yêu thích
        </p>

    </div>


    <div class="feature-card">

        <div class="feature-icon">

            <i class="fa-solid fa-users"></i>

        </div>

        <h3 id="totalUsers">
            0
        </h3>

        <p>
            Người dùng
        </p>

    </div>

</div>



<!-- ADD GAME -->

<div class="ai-box">

    <div class="ai-title">

        <div class="ai-title-icon">

            <i class="fa-solid fa-plus"></i>

        </div>

        <div>

            <span>GAME MANAGEMENT</span>

            <h2>
                Thêm / chỉnh sửa game
            </h2>

        </div>

    </div>


    <form id="gameForm">

        <input
            type="hidden"
            id="gameId"
        >


        <div
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:15px;
            "
        >

            <div class="form-group">

                <label>
                    Tên game
                </label>

                <input
                    type="text"
                    id="gameTitle"
                    placeholder="Nhập tên game"
                    required
                    style="
                        width:100%;
                        padding:13px;
                        border:1px solid rgba(255,255,255,.1);
                        border-radius:10px;
                        background:rgba(0,0,0,.2);
                        color:white;
                    "
                >

            </div>


            <div class="form-group">

                <label>
                    Thể loại
                </label>

                <select
                    id="gameCategory"
                    required
                    style="
                        width:100%;
                        padding:13px;
                        border:1px solid rgba(255,255,255,.1);
                        border-radius:10px;
                        background:#121425;
                        color:white;
                    "
                >

                    <option value="shooter">
                        Bắn súng
                    </option>

                    <option value="mmorpg">
                        MMORPG
                    </option>

                    <option value="strategy">
                        Chiến thuật
                    </option>

                    <option value="racing">
                        Đua xe
                    </option>

                    <option value="action">
                        Hành động
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Hình ảnh
                </label>

                <input
                    type="url"
                    id="gameImage"
                    placeholder="https://..."
                    required
                    style="
                        width:100%;
                        padding:13px;
                        border:1px solid rgba(255,255,255,.1);
                        border-radius:10px;
                        background:rgba(0,0,0,.2);
                        color:white;
                    "
                >

            </div>


            <div class="form-group">

                <label>
                    Đánh giá
                </label>

                <input
                    type="number"
                    id="gameRating"
                    min="0"
                    max="5"
                    step="0.1"
                    value="4.5"
                    style="
                        width:100%;
                        padding:13px;
                        border:1px solid rgba(255,255,255,.1);
                        border-radius:10px;
                        background:rgba(0,0,0,.2);
                        color:white;
                    "
                >

            </div>

        </div>


        <div
            style="
                display:flex;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <button
                type="submit"
                class="btn-primary"
                style="border:none;"
                id="saveGameBtn"
            >

                <i class="fa-solid fa-plus"></i>

                Thêm game

            </button>


            <button
                type="button"
                class="btn-secondary"
                id="cancelEditBtn"
                style="display:none;"
            >

                Hủy chỉnh sửa

            </button>

        </div>

    </form>

</div>



<!-- GAME TABLE -->

<section>

    <div class="section-title">

        <div>

            <span>DATABASE</span>

            <h2>
                Danh sách game
            </h2>

        </div>

    </div>


    <div
        style="
            overflow-x:auto;
        "
    >

        <table
            style="
                width:100%;
                border-collapse:collapse;
                background:#121425;
                border-radius:15px;
                overflow:hidden;
            "
        >

            <thead>

                <tr
                    style="
                        background:#191b2c;
                        text-align:left;
                    "
                >

                    <th style="padding:15px;">
                        ID
                    </th>

                    <th style="padding:15px;">
                        Game
                    </th>

                    <th style="padding:15px;">
                        Thể loại
                    </th>

                    <th style="padding:15px;">
                        Rating
                    </th>

                    <th style="padding:15px;">
                        Thao tác
                    </th>

                </tr>

            </thead>


            <tbody id="adminGameList">

            </tbody>

        </table>

    </div>

</section>


</div>

</section>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container">

        <div class="footer-bottom">

            GameHub Admin Panel © 2026

        </div>

    </div>

</footer>



<script src="../js/admin.js"></script>

</body>
</html>
