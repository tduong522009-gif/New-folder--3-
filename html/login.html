<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Đăng nhập vào tài khoản GameHub"
    >

    <title>GameHub - Đăng nhập</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        <link rel="stylesheet" href="../style.css">
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container header-container">


            <a
                href="index.html"
                class="logo"
            >

                <i class="fa-solid fa-gamepad"></i>

                <span>
                    GameHub
                </span>

            </a>


            <nav class="nav">

                <a href="index.html">

                    <i class="fa-solid fa-house"></i>

                    Trang chủ

                </a>


                <a href="games.html">

                    <i class="fa-solid fa-gamepad"></i>

                    Games

                </a>


                <a
                    href="register.html"
                >

                    <i class="fa-solid fa-user-plus"></i>

                    Đăng ký

                </a>

            </nav>

        </div>

    </header>



    <!-- ================= LOGIN ================= -->

    <main class="auth-page">

        <div class="auth-box">


            <!-- LOGO -->

            <div class="auth-logo">

                <div class="auth-icon">

                    <i
                        class="fa-solid fa-gamepad"
                    ></i>

                </div>


                <h1>
                    GameHub
                </h1>


                <p>
                    Đăng nhập tài khoản
                </p>

            </div>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">

                        <i
                            class="fa-solid fa-envelope"
                        ></i>

                        Email

                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        required
                        placeholder="Nhập email"
                        autocomplete="email"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">

                        <i
                            class="fa-solid fa-lock"
                        ></i>

                        Mật khẩu

                    </label>


                    <input
                        type="password"
                        id="loginPassword"
                        required
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                    >

                </div>



                <!-- MESSAGE -->

                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn-primary auth-submit"
                >

                    <i
                        class="fa-solid fa-right-to-bracket"
                    ></i>

                    Đăng nhập

                </button>

            </form>



            <!-- REGISTER -->

            <div class="auth-footer">

                Chưa có tài khoản?

                <a href="register.html">
                    Đăng ký ngay
                </a>

            </div>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    © 2026 GameHub. All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/auth.js"></script>

</body>

</html>
